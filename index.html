<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniData Pro | Control Center</title>
    <style>
        /* एकदम बेसिक और जरूरी स्टाइलिंग */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; }

        /* स्क्रीन कंट्रोल */
        .screen { display: none; height: 100vh; width: 100%; }
        .screen.active { display: block; }

        /* साइडबार (कंट्रोल सेंटर) */
        .sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #0f172a; color: #fff; transition: 0.3s; padding-top: 20px; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar.open { left: 0; }
        .menu-header { padding: 20px; font-size: 1.2rem; border-bottom: 1px solid #1e293b; margin-bottom: 10px; }
        .sidebar-link { padding: 15px 20px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #1e293b; }
        .sidebar-link:hover { background: #1e293b; color: #38bdf8; }
        .logout-btn { color: #f87171; font-weight: bold; margin-top: auto; }

        /* हेडर और डैशबोर्ड */
        .header { background: #0f172a; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #e2e8f0; transition: 0.2s; }
        .card:hover { border-color: #38bdf8; }

        /* लॉगिन स्क्रीन */
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { width: 300px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन सेक्शन -->
    <div id="screen-login" class="screen active login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">Login</h2>
            <input type="text" id="user" placeholder="User ID">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="login()">Enter Dashboard</button>
        </div>
    </div>

    <!-- 2. डैशबोर्ड सेक्शन -->
    <div id="screen-dashboard" class="screen">
        <!-- साइडबार -->
        <div class="sidebar" id="sidebar">
            <div class="menu-header">OmniData Menu</div>
            <div class="sidebar-link" onclick="toggleSidebar()">⬅️ बंद करें</div>
            <div class="sidebar-link" onclick="alert('डैशबोर्ड पर आपका स्वागत है')">📊 डैशबोर्ड होम</div>
            <div class="sidebar-link" onclick="alert('प्रोफाइल सेटिंग: अपना डेटा मैनेज करें')">👤 प्रोफाइल सेटिंग्स</div>
            <div class="sidebar-link" onclick="alert('टास्क रिपोर्ट: 12 पेंडिंग, 0 कंप्लीट')">📝 टास्क रिपोर्ट</div>
            <div class="sidebar-link" onclick="alert('सिंक: ऑनलाइन डेटा सुरक्षित है')">🔄 सिंक स्टेटस</div>
            <div class="sidebar-link" onclick="alert('सेटिंग्स: ऐप कॉन्फ़िगरेशन')">⚙️ मुख्य सेटिंग्स</div>
            <div class="sidebar-link logout-btn" onclick="location.reload()">🚪 लॉग आउट</div>
        </div>

        <!-- हेडर -->
        <div class="header">
            <div onclick="toggleSidebar()">☰ Menu</div>
            <div>OMNIDATA PRO</div>
            <div style="width: 40px;"></div>
        </div>

        <!-- टास्क ग्रिड -->
        <div class="grid" id="task-grid"></div>
    </div>

    <script>
        // फंक्शन: साइडबार टॉगल
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        // फंक्शन: लॉगिन
        function login() { 
            document.getElementById('screen-login').classList.remove('active'); 
            document.getElementById('screen-dashboard').classList.add('active'); 
        }

        // फंक्शन: टास्क ग्रिड बनाना
        const tasks = ["बेसिक डेटा", "ऑनलाइन", "ईकॉमर्स", "ट्रांसक्रिप्शन", "इमेज", "वेब रिसर्च", "क्लीनिंग", "सर्वे", "मेडिकल", "लीगल", "माइनिंग", "अदर"];
        const grid = document.getElementById('task-grid');
        tasks.forEach(t => {
            grid.innerHTML += `<div class="card" onclick="alert('${t} फॉर्म खुल रहा है...')">${t}</div>`;
        });
    </script>
</body>
</html>
