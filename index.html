<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro - Full Movement</title>
    <style>
        body { background: #0f172a; margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #2563eb; color: white; }
        .hidden { display: none; }
        .nav-text { color: #2563eb; cursor: pointer; font-size: 14px; margin-top: 15px; display: block; }
        /* डैशबोर्ड की मूवमेंट */
        #dashboard { color: white; text-align: center; }
    </style>
</head>
<body>

    <div id="login-div" class="card">
        <h2>लॉगिन करें</h2>
        <input type="email" class="input-box" placeholder="ईमेल">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        <button class="btn" onclick="moveTo('dashboard')">लॉगिन करें</button>
        <span class="nav-text" onclick="moveTo('signup-div')">साइन अप करें</span>
    </div>

    <div id="signup-div" class="card hidden">
        <h2>नया अकाउंट</h2>
        <input type="text" class="input-box" placeholder="नाम">
        <input type="email" class="input-box" placeholder="ईमेल">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        <button class="btn" style="background:#10b981" onclick="moveTo('dashboard')">रजिस्टर करें</button>
        <span class="nav-text" onclick="moveTo('login-div')">वापस लॉगिन पर</span>
    </div>

    <div id="dashboard" class="hidden">
        <h1>आपका डैशबोर्ड तैयार है!</h1>
        <button class="btn" style="background:#ef4444" onclick="moveTo('login-div')">लॉग आउट (बाहर निकलें)</button>
    </div>

    <script>
        function moveTo(id) {
            // सब छुपाओ
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('signup-div').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            
            // जिसे दिखाना है, उसे दिखाओ
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
