<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>OmniData Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app" class="container">
        <div id="login-box">
            <h2>OmniData Pro - Login</h2>
            <input type="text" id="honeytrap" style="display:none;" tabindex="-1">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="loginUser()">Login</button>
            <p onclick="showScreen('signup-box')">New User? Sign Up</p>
        </div>

        <div id="signup-box" style="display:none;">
            <h2>Sign Up</h2>
            <input type="email" id="s-email" placeholder="Email">
            <input type="password" id="s-password" placeholder="Password">
            <button onclick="signUpUser()">Sign Up</button>
            <p onclick="showScreen('login-box')">Back to Login</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
