<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro - Final System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b1117; color: #ffffff; font-family: sans-serif; display: flex; height: 100vh; }

        /* साइडबार */
        #sidebar { width: 260px; background: rgba(20, 30, 40, 0.95); padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .user-info { text-align: center; margin-bottom: 30px; }
        .user-info img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #3498db; }
        .nav-item { padding: 12px; color: #aaa; cursor: pointer; border-bottom: 1px solid #222; transition: 0.3s; }
        .nav-item:hover { color: #fff; background: rgba(52, 152, 219, 0.1); }

        /* मुख्य वर्क एरिया */
        #work-area { flex-grow: 1; padding: 30px; overflow-y: auto; background: linear-gradient(135deg, #0b1117 0%, #1a2a3a 100%); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* डेटा टेबल और शीट्स व्यू */
        .sheet-container { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid #444; }
        table { width: 100%; border-collapse: collapse; background: white; color: black; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        
        /* प्रोग्रेस और स्टेटस पैनल्स */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>

    <!-- साइडबार -->
    <div id="sidebar">
        <div class="user-info">
            <img src="https://via.placeholder.com/70" alt="Profile">
            <h4 style="margin-top:10px;">Rajesh Gupta</h4>
            <p style="font-size:12px;">CEO, Omni Data Pro</p>
        </div>
        <div class="nav-item">मेरी प्रोफाइल</div>
        <div class="nav-item">सेटिंग्स</div>
        <div class="nav-item">मेरे प्रोजेक्ट्स</div>
        <div class="nav-item">यूजर गाइड</div>
        <div class="nav-item" style="margin-top: auto;" onclick="alert('Logging out...')">लॉग आउट</div>
    </div>

    <!-- मुख्य डैशबोर्ड -->
    <div id="work-area">
        <div class="header">
            <h2>Omni Data Pro - वर्किंग बोर्ड</h2>
            <button style="padding: 10px 20px; background: #3498db; border:none; border-radius:5px; color:white;">Back</button>
        </div>

        <div class="sheet-container">
            <table id="data-table">
                <thead>
                    <tr style="background:#f4f4f4;">
                        <th>Client Name</th><th>Project Type</th><th>Item Code</th><th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>-</td><td>-</td><td>-</td><td>-</td></tr>
                </tbody>
            </table>
            <button onclick="addRow()" style="margin-top:10px; padding:10px;">Add New Row</button>
        </div>

        <div class="status-grid">
            <div class="panel"><h4>प्रगति पर (In Progress)</h4><p>Live Validation Active</p></div>
            <div class="panel"><h4>समीक्षा के लिए (Pending)</h4><p>Accuracy: 99%</p></div>
        </div>
    </div>

    <script>
        function addRow() {
            let tbody = document.getElementById('data-table').getElementsByTagName('tbody')[0];
            let row = tbody.insertRow();
            for(let i=0; i<4; i++) row.insertCell(i).innerHTML = "-";
        }
    </script>
</body>
</html>
