<!DOCTYPE html>
<html>
<body>
  <!-- डैशबोर्ड सेक्शन -->
  <div id="dashboard">
    <h2>Data Entry Dashboard</h2>
    
    <!-- ऑथेंटिकेशन फॉर्म -->
    <div id="auth-section">
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="handleSignUp()">Sign Up</button>
      <button onclick="handleLogin()">Login</button>
      <button onclick="handleForgotPassword()">Forgot Password</button>
    </div>

    <!-- डेटा एंट्री फॉर्म (जो लॉग-इन के बाद दिखेगा) -->
    <div id="entry-section" style="display:none;">
      <input type="text" id="data-input" placeholder="Enter your data here" />
      <button onclick="saveData()">Save Data</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js';

    // Vercel के एनवायरनमेंट वेरिएबल्स का उपयोग
    const supabase = createClient(
      process.env.NEXT_PUBLIC_SUPABASE_URL,
      process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY
    );

    // 1. साइन अप
    window.handleSignUp = async () => {
      const { error } = await supabase.auth.signUp({ email: document.getElementById('email').value, password: document.getElementById('password').value });
      alert(error ? error.message : "ईमेल चेक करें!");
    };

    // 2. लॉग इन (लॉगिन सफल होने पर एंट्री सेक्शन दिखाएगा)
    window.handleLogin = async () => {
      const { error } = await supabase.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
      if (error) {
        alert(error.message);
      } else {
        alert("लॉग इन सफल!");
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('entry-section').style.display = 'block';
      }
    };

    // 3. फॉरगेट पासवर्ड
    window.handleForgotPassword = async () => {
      const { error } = await supabase.auth.resetPasswordForEmail(document.getElementById('email').value);
      alert(error ? error.message : "पासवर्ड रिसेट लिंक भेज दिया गया है!");
    };

    // 4. डेटा सेव करने का फंक्शन
    window.saveData = async () => {
      const val = document.getElementById('data-input').value;
      const { error } = await supabase.from('your_table_name').insert([{ column_name: val }]);
      alert(error ? error.message : "डेटा सेव हो गया!");
    };
  </script>
</body>
</html>
