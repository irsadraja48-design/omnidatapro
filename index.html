<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro - Full System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f4f7f6; height: 100vh; display: flex; flex-direction: column; }
        .view { display: none; height: 100vh; width: 100%; }
        .active { display: flex; }
        
        /* Auth View Styles */
        .auth-container { justify-content: center; align-items: center; background: #2c3e50; }
        .card { background: white; padding: 40px; border-radius: 8px; width: 350px; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; cursor: pointer; }
        .links { margin-top: 15px; text-align: center; font-size: 14px; color: #3498db; cursor: pointer; }

        /* Dashboard Styles */
        #dashboard-view { display: none; flex-direction: row; }
        #sidebar { width: 260px; background: #1a252f; color: white; padding: 20px; display: flex; flex-direction: column; }
        .nav-item { padding: 15px; border-bottom: 1px solid #34495e; cursor: pointer; }
        #workspace { flex-grow: 1; padding: 20px; overflow-y: auto; }
        .grid { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        #val-panel { width: 300px; padding: 20px; border-left: 1px solid #ddd; background: white; }
    </style>
</head>
<body>

    <!-- 1. Login Screen -->
    <div id="login-view" class="view active auth-container">
        <div class="card">
            <h2>Login</h2>
            <input type="text" class="input-field" placeholder="Username">
            <input type="password" class="input-field" placeholder="Password">
            <button class="btn" onclick="showView('dashboard-view')">Sign In</button>
            <div class="links" onclick="showView('signup-view')">Sign Up</div>
            <div class="links" onclick="showView('forgot-view')">Forgot Password?</div>
        </div>
    </div>

    <!-- 2. Signup Screen -->
    <div id="signup-view" class="view auth-container">
        <div class="card">
            <h2>Sign Up</h2>
            <input type="text" class="input-field" placeholder="Full Name">
            <input type="email" class="input-field" placeholder="Email">
            <input type="password" class="input-field" placeholder="Create Password">
            <button class="btn" onclick="showView('login-view')">Register</button>
            <div class="links" onclick="showView('login-view')">Back to Login</div>
        </div>
    </div>

    <!-- 3. Forgot Password Screen -->
    <div id="forgot-view" class="view auth-container">
        <div class="card">
            <h2>Forgot Password</h2>
            <input type="email" class="input-field" placeholder="Enter your registered email">
            <button class="btn" onclick="showView('login-view')">Send Reset Link</button>
            <div class="links" onclick="showView('login-view')">Back to Login</div>
        </div>
    </div>

    <!-- 4. Main Dashboard Screen -->
    <div id="dashboard-view" class="view">
        <div id="sidebar">
            <h2>Omni Data Pro</h2>
            <div class="nav-item">Dashboard</div>
            <div class="nav-item">My Projects</div>
            <div class="nav-item" style="margin-top: auto;" onclick="showView('login-view')">Logout</div>
        </div>
        <div id="workspace">
            <h3>Work Area</h3>
            <button onclick="addRow()">Add New Row</button>
            <table class="grid" id="data-table">
                <thead><tr><th>Client Name</th><th>Project Category</th><th>Item Code</th><th>Description</th></tr></thead>
                <tbody><tr><td>-</td><td>-</td><td>-</td><td>-</td></tr></tbody>
            </table>
        </div>
        <div id="val-panel">
            <h3>System Status</h3>
            <p>Status: Active</p>
        </div>
    </div>

    <script>
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }
        function addRow() {
            let tbody = document.getElementById('data-table').getElementsByTagName('tbody')[0];
            let row = tbody.insertRow();
            for(let i=0; i<4; i++) row.insertCell(i).innerHTML = "-";
        }
    </script>
</body>
</html>
