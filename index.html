<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>OmniData Pro | Official</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        .screen { display: none; }
        .active { display: block; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        /* Dashboard Header Fix */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; }
        
        /* Sidebar Fix */
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; position: fixed; top: 0; left: -250px; transition: 0.3s; padding: 20px; z-index: 1000; }
        .sidebar.open { left: 0; }
        .menu-item { padding: 15px 0; cursor: pointer; border-bottom: 1px solid #3e4f5f; }
        
        /* Grid Fix */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<!-- AUTH -->
<div id="auth-wrapper" class="active">
    <div id="login-box" class="screen active container">
        <h1>OmniData Pro</h1>
        <h2>Welcome</h2>
        <input type="text" placeholder="User ID">
        <input type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-wrapper" style="display:none;">
    <div class="sidebar" id="sidebar">
        <h2>Menu</h2>
        <div class="menu-item">👤 मेरी प्रोफाइल</div>
        <div class="menu-item">⚙️ सेटिंग्स</div>
        <div class="menu-item" onclick="location.reload()">🚪 लॉग आउट</div>
    </div>
    
    <div class="header">
        <span onclick="toggleSidebar()" style="cursor:pointer; font-size: 24px;">☰ Menu</span>
        <strong>OmniData Pro</strong>
        <span>User ID: [UID-XXXX]</span>
    </div>

    <div class="grid">
        <div class="card">1. बेसिक डेटा</div><div class="card">2. ऑनलाइन डेटा</div><div class="card">3. ईकॉमर्स</div><div class="card">4. ट्रांसक्रिप्शन</div>
        <div class="card">5. इमेज टू टेक्स्ट</div><div class="card">6. वेब रिसर्च</div><div class="card">7. डेटा क्लीनिंग</div><div class="card">8. सर्वे फॉर्म</div>
        <div class="card">9. मेडिकल एंट्री</div><div class="card">10. लीगल एंट्री</div><div class="card">11. माइनिंग</div><div class="card">12. अदर टास्क</div>
    </div>
</div>

<script>
    function login() {
        document.getElementById('auth-wrapper').style.display = 'none';
        document.getElementById('dashboard-wrapper').style.display = 'block';
    }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
</script>
</body>
</html>
