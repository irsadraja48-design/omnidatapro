<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniData Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Welcome to OmniData Pro</h1>
        
        <div id="login-box" class="screen">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="login-btn" onclick="loginUser()">Login</button>
            <p onclick="showScreen('signup-box')">New User? Sign Up</p>
            <p onclick="showScreen('forget-box')">Forgot Password?</p>
        </div>

        <div id="signup-box" class="screen">
            <h2>Sign Up</h2>
            <input type="email" id="s-email" placeholder="Email">
            <input type="password" id="s-password" placeholder="Password">
            <button id="signup-btn" onclick="signUpUser()">Sign Up</button>
            <p onclick="showScreen('login-box')">Back to Login</p>
        </div>

        <div id="forget-box" class="screen">
            <h2>Reset Password</h2>
            <input type="email" id="f-email" placeholder="Enter Email">
            <button id="reset-btn" onclick="resetPassword()">Send Reset Link</button>
            <p onclick="showScreen('login-box')">Back to Login</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
