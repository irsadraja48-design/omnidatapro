<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro - Full System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b1117; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* साइडबार - बायां हिस्सा */
        #sidebar { width: 280px; background: rgba(20, 30, 40, 0.95); padding: 25px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .user-profile { text-align: center; margin-bottom: 40px; }
        .user-profile img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #3498db; }
        .menu-item { padding: 15px; color: #95a5a6; cursor: pointer; border-bottom: 1px solid #222; transition: 0.3s; }
        .menu-item:hover { color: #fff; background: rgba(52, 152, 219, 0.1); }

        /* मुख्य एरिया */
        #content-area { flex-grow: 1; padding: 40px; background: radial-gradient(circle at top right, #1a2a3a, #0b1117); overflow-y: auto; }
        
        /* कार्ड्स और टाइल्स */
        .glass-box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .grid-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .tile { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid #444; }
        
        /* फॉर्म और टेबल */
        input { background: #1a2a3a; border: 1px solid #444; color: white; padding: 12px; width: 100%; margin: 10px 0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #000; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <!-- बायां साइडबार -->
    <div id="sidebar">
        <div class="user-profile">
            <img src="https://via.placeholder.com/80" alt="CEO">
            <h3 style="margin-top: 10px;">Rajesh Gupta</h3>
            <p style="font-size: 13px; color: #3498db;">CEO, Omni Data Pro</p>
        </div>
        <div class="menu-item" onclick="show('dashboard')">डैशबोर्ड</div>
        <div class="menu-item" onclick="show('signup')">साइन अप</div>
        <div class="menu-item">सेटिंग्स</div>
        <div class="menu-item">मेरे प्रोजेक्ट्स</div>
        <div class="menu-item" style="margin-top: auto;">लॉग आउट</div>
    </div>

    <!-- मुख्य वर्क एरिया -->
    <div id="content-area">
        
        <!-- डैशबोर्ड टाइल व्यू -->
        <div id="dashboard" class="page">
            <h2>Omni Data Pro Dashboard</h2>
            <div class="grid-tiles">
                <div class="tile"><h3>डेटा एंट्री</h3><p>ऑनलाइन/ऑफलाइन</p></div>
                <div class="tile"><h3>OCR यूनिट</h3><p>इमेज टू टेक्स्ट</p></div>
                <div class="tile"><h3>AI असिस्टेंट</h3><p>लाइव वैलिडेशन</p></div>
            </div>
        </div>

        <!-- साइन-अप फॉर्म -->
        <div id="signup" class="page" style="display:none;">
            <div class="glass-box" style="width: 400px; margin: auto;">
                <h2>साइन अप करें</h2>
                <input type="text" placeholder="पूरा नाम">
                <input type="email" placeholder="ईमेल पता">
                <input type="password" placeholder="पासवर्ड">
                <button style="width: 100%; padding: 12px; background: #3498db; border:none; color:white; border-radius:6px;">साइन अप</button>
            </div>
        </div>
    </div>

    <script>
        function show(pageId) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }
    </script>
</body>
</html>
