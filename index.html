<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniData Pro | Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; display: flex; }
        /* Sidebar Styling */
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; position: fixed; }
        .sidebar h2 { color: #3498db; }
        .menu-item { padding: 15px 0; border-bottom: 1px solid #3e4f5f; cursor: pointer; }
        /* Main Content */
        .main-content { margin-left: 250px; padding: 20px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 8px; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ai-btn { background: #9b59b6; color: white; padding: 15px; border-radius: 50px; position: fixed; bottom: 20px; right: 20px; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>OmniData Pro</h2>
    <div class="menu-item">👤 मेरी प्रोफाइल</div>
    <div class="menu-item">⚙️ सेटिंग्स</div>
    <div class="menu-item">📂 मेरे प्रोजेक्ट्स</div>
    <div class="menu-item">❓ यूजर गाइड</div>
    <div class="menu-item">🚪 लॉग आउट</div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="header">
        <button>⬅️ Back</button>
        <input type="text" placeholder="Search...">
        <div class="profile-icon">👤</div>
    </div>

    <!-- Data Services Grid -->
    <div class="grid-container">
        <div class="card"><h3>बेसिक डेटा एंट्री</h3></div>
        <div class="card"><h3>ऑनलाइन डेटा एंट्री</h3></div>
        <div class="card"><h3>ईकॉमर्स (कैटलॉग) डेटा</h3></div>
        <div class="card"><h3>डेटा ट्रांसक्रिप्शन</h3></div>
        <div class="card"><h3>इमेज टू टेक्स्ट एंट्री</h3></div>
        <div class="card"><h3>वेब रिसर्च और माइनिंग</h3></div>
        <div class="card"><h3>डेटा क्लीनिंग</h3></div>
        <div class="card"><h3>सर्वे और फॉर्म फिलिंग</h3></div>
        <div class="card"><h3>मेडिकल डेटा एंट्री</h3></div>
    </div>

    <!-- AI Feature Floating Button -->
    <div class="ai-btn">🤖 AI Feature</div>
</div>

</body>
</html>
