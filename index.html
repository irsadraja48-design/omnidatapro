<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: white; display: flex; justify-content: center; padding-top: 50px; font-family: Arial; }
        .box { background: #1e293b; padding: 25px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #334; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 10px; background: #3b82f6; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn-secondary { background: none; border: none; color: #94a3b8; cursor: pointer; text-decoration: underline; margin-top: 10px; display: block; width: 100%; }
    </style>
</head>
<body>

<div class="box">
    <h2>Omni Data Pro</h2>
    
    <input type="email" id="email" placeholder="ईमेल डालें">
    <input type="password" id="password" placeholder="पासवर्ड डालें">
    
    <button class="btn-login" onclick="login()">लॉगिन</button>
    
    <button class="btn-secondary" onclick="signup()">नया अकाउंट बनाएं (साइन अप)</button>
    <button class="btn-secondary" onclick="resetPassword()">पासवर्ड भूल गए?</button>
</div>

<script>
    // Supabase Setup
    const supabaseUrl = 'https://uenidxhrocphbtxpuyxr.supabase.co';
    const supabaseKey = 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // लॉगिन फंक्शन
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message); else alert("लॉगिन सफल रहा!");
    }

    // साइन अप फंक्शन
    async function signup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) alert(error.message); else alert("साइन अप सफल! कृपया अपनी ईमेल चेक करें।");
    }

    // फॉरगेट पासवर्ड फंक्शन
    async function resetPassword() {
        const email = document.getElementById('email').value;
        if (!email) { alert("कृपया ऊपर अपना ईमेल डालें"); return; }
        const { error } = await supabase.auth.resetPasswordForEmail(email);
        if (error) alert(error.message); else alert("पासवर्ड रीसेट लिंक आपके ईमेल पर भेज दिया गया है।");
    }
</script>

</body>
</html>
