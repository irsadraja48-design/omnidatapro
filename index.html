<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Data Pro - Full System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f4f7f6; height: 100vh; display: flex; flex-direction: column; }
        
        .page-view { display: none; height: 100vh; width: 100%; }
        .page-view.show { display: flex; }
        
        .auth-container { justify-content: center; align-items: center; background: #2c3e50; }
        .box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-act { width: 100%; padding: 12px; background: #3498db; color: white; border: none; cursor: pointer; }
        .link-text { margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; }

        #dashboard { display: none; flex-direction: row; }
        #sidebar { width: 260px; background: #1a252f; color: white; padding: 20px; }
        .nav-link { padding: 15px; border-bottom: 1px solid #34495e; cursor: pointer; }
        #main-work { flex-grow: 1; padding: 20px; background: #ecf0f1; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { border: 1px solid #bdc3c7; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन पेज -->
    <div id="login-page" class="page-view show auth-container">
        <div class="box">
            <h2>Login</h2>
            <input type="text" class="input-box" placeholder="Username">
            <input type="password" class="input-box" placeholder="Password">
            <button class="btn-act" onclick="changePage('dashboard')">Sign In</button>
            <div class="link-text" onclick="changePage('signup')">Sign Up | Forgot Password</div>
        </div>
    </div>

    <!-- 2. साइन-अप पेज (पासवर्ड फ़ील्ड के साथ) -->
    <div id="signup-page" class="page-view auth-container">
        <div class="box">
            <h2>Create Account</h2>
            <input type="text" class="input-box" placeholder="Full Name">
            <input type="email" class="input-box" placeholder="Email Address">
            <input type="password" class="input-box" placeholder="Create Password">
            <button class="btn-act" onclick="changePage('login')">Register</button>
            <div class="link-text" onclick="changePage('login')">Back to Login</div>
        </div>
    </div>

    <!-- 3. डैशबोर्ड पेज -->
    <div id="dashboard" class="page-view" style="flex-direction: row;">
        <div id="sidebar">
            <h3>OMNI DATA PRO</h3>
            <div class="nav-link">Dashboard</div>
            <div class="nav-link">My Projects</div>
            <div class="nav-link" style="margin-top: 150px;" onclick="changePage('login')">Logout</div>
        </div>
        <div id="main-work">
            <h3>Work Area</h3>
            <button onclick="addRow()">Add New Entry</button>
            <table id="data-table">
                <thead><tr><th>Client</th><th>Project</th><th>Code</th><th>Status</th></tr></thead>
                <tbody><tr><td>-</td><td>-</td><td>-</td><td>-</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        function changePage(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('show'));
            if(pageId === 'dashboard') {
                document.getElementById('dashboard').classList.add('show');
            } else if(pageId === 'signup') {
                document.getElementById('signup-page').classList.add('show');
            } else {
                document.getElementById('login-page').classList.add('show');
            }
        }
        function addRow() {
            let table = document.getElementById('data-table').getElementsByTagName('tbody')[0];
            let row = table.insertRow();
            for(let i=0; i<4; i++) row.insertCell(i).innerHTML = "-";
        }
    </script>
</body>
</html>
