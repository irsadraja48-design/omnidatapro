<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <style>
        body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; }
        .page { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .active { display: flex; }
        .box { background: #161e2e; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन पेज -->
    <div id="login-pg" class="page active">
        <div class="box">
            <h1>लॉगिन</h1>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button onclick="show('dash-pg')">Login</button>
            <button style="background:none;" onclick="show('signup-pg')">नया अकाउंट बनाएँ (Sign Up)</button>
            <button style="background:none; color:#94a3b8;" onclick="show('forgot-pg')">Forgot Password?</button>
        </div>
    </div>

    <!-- 2. साइन-अप पेज -->
    <div id="signup-pg" class="page">
        <div class="box">
            <h1>Sign Up</h1>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button onclick="show('dash-pg')">Register</button>
            <button style="background:none;" onclick="show('login-pg')">वापस लॉगिन पर जाएँ</button>
        </div>
    </div>

    <!-- 3. फॉरगेट पासवर्ड पेज -->
    <div id="forgot-pg" class="page">
        <div class="box">
            <h1>Forgot Password</h1>
            <input type="email" placeholder="अपना ईमेल डालें">
            <button onclick="alert('लिंक भेज दिया गया!'); show('login-pg')">Reset Password</button>
            <button style="background:none;" onclick="show('login-pg')">वापस लॉगिन पर जाएँ</button>
        </div>
    </div>

    <!-- 4. डैशबोर्ड -->
    <div id="dash-pg" class="page">
        <h2>आपका डैशबोर्ड यहाँ है!</h2>
        <button onclick="location.reload()">लॉग आउट</button>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
