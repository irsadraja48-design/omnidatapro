<!DOCTYPE html>
<html>
<head>
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }
        .page { display: none; }
        .active { display: block; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; background: #3b82f6; color: white; font-weight: bold; }
        .link { background: none; color: #94a3b8; text-decoration: underline; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="box">
    <!-- लॉगिन -->
    <div id="login" class="page active">
        <h2>लॉगिन</h2>
        <input type="email" id="l-email" placeholder="Email">
        <input type="password" id="l-pass" placeholder="Password">
        <button onclick="login()">लॉगिन</button>
        <button class="link" onclick="show('signup')">नया अकाउंट बनाएं</button>
        <button class="link" onclick="show('forgot')">पासवर्ड भूल गए?</button>
    </div>

    <!-- साइन अप -->
    <div id="signup" class="page">
        <h2>साइन अप</h2>
        <input type="email" id="s-email" placeholder="Email">
        <input type="password" id="s-pass" placeholder="Password">
        <button onclick="signup()">रजिस्टर करें</button>
        <button class="link" onclick="show('login')">वापस लॉगिन पर जाएं</button>
    </div>

    <!-- फॉरगेट -->
    <div id="forgot" class="page">
        <h2>पासवर्ड रीसेट</h2>
        <input type="email" id="f-email" placeholder="Email">
        <button onclick="reset()">लिंक भेजें</button>
        <button class="link" onclick="show('login')">वापस लॉगिन पर जाएं</button>
    </div>

    <!-- डैशबोर्ड (अंदर की स्क्रीन) -->
    <div id="dashboard" class="page">
        <h2>स्वागत है!</h2>
        <p>आप सफलतापूर्वक Omni Data Pro में लॉगिन हो गए हैं।</p>
        <button onclick="location.reload()">लॉग आउट</button>
    </div>
</div>

<script>
    const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');
    
    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function login() {
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('l-email').value, password: document.getElementById('l-pass').value });
        if (error) alert(error.message); else show('dashboard');
    }

    async function signup() {
        const { error } = await sb.auth.signUp({ email: document.getElementById('s-email').value, password: document.getElementById('s-pass').value });
        if (error) alert(error.message); else alert("साइन अप सफल! कृपया अपनी ईमेल चेक करें।");
    }

    async function reset() {
        const { error } = await sb.auth.resetPasswordForEmail(document.getElementById('f-email').value);
        if (error) alert(error.message); else alert("रीसेट लिंक भेज दिया गया है।");
    }
</script>
</body>
</html>
