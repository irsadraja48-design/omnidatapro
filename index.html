<!DOCTYPE html>
<html>
<head>
    <title>Omni Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #222; padding: 30px; border-radius: 20px; width: 300px; }
        .page { display: none; }
        .active { display: block; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #444; background: #333; color: white; border-radius: 5px; }
        button { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="box">
    <!-- लॉगिन -->
    <div id="login" class="page active">
        <h2>लॉगिन</h2>
        <input type="email" id="l-email" placeholder="Email">
        <input type="password" id="l-pass" placeholder="Password">
        <button onclick="auth('login')">लॉगिन</button>
        <button onclick="show('signup')">साइन अप स्क्रीन</button>
        <button onclick="show('forgot')">फॉरगेट पासवर्ड</button>
    </div>

    <!-- साइन अप -->
    <div id="signup" class="page">
        <h2>साइन अप</h2>
        <input type="email" id="s-email" placeholder="Email">
        <input type="password" id="s-pass" placeholder="Password">
        <button onclick="auth('signup')">अकाउंट बनाएं</button>
        <button onclick="show('login')">वापस</button>
    </div>

    <!-- फॉरगेट -->
    <div id="forgot" class="page">
        <h2>पासवर्ड फॉरगेट</h2>
        <input type="email" id="f-email" placeholder="Email">
        <button onclick="auth('forgot')">रीसेट लिंक भेजें</button>
        <button onclick="show('login')">वापस</button>
    </div>
</div>

<script>
    const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');
    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    async function auth(type) {
        let e = document.getElementById(type === 'login' ? 'l-email' : type === 'signup' ? 's-email' : 'f-email').value;
        let p = type === 'login' ? document.getElementById('l-pass').value : document.getElementById('s-pass').value;
        let res;
        if(type === 'login') res = await sb.auth.signInWithPassword({email:e, password:p});
        else if(type === 'signup') res = await sb.auth.signUp({email:e, password:p});
        else res = await sb.auth.resetPasswordForEmail(e);
        if(res.error) alert(res.error.message); else alert("Done!");
    }
</script>
</body>
</html>
