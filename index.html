<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>OmniData Pro - Test</title>
    <style>
        .screen { display: none; }
        #login-box { display: block; }
    </style>
</head>
<body>

    <div id="login-box" class="screen">
        <h2>Login Screen</h2>
        <button onclick="showScreen('signup-box')">Go to Sign Up</button>
    </div>

    <div id="signup-box" class="screen">
        <h2>Sign Up Screen</h2>
        <button onclick="showScreen('login-box')">Back to Login</button>
    </div>

    <script>
        function showScreen(id) {
            console.log("Button clicked, switching to: " + id);
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</body>
</html>
