<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Data Pro</title>
    <style>
        body { background: #0f172a; margin: 0; font-family: sans-serif; color: white; }
        .page { display: none; padding: 20px; }
        .active { display: block; }
        .card { background: white; padding: 30px; border-radius: 20px; width: 300px; color: #1e293b; margin: 80px auto; text-align: center; }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .link { color: #2563eb; cursor: pointer; text-decoration: underline; display: block; margin-top: 10px; font-size: 14px; }
        
        /* डैशबोर्ड लेआउट */
        .top-bar { display: flex; justify-content: space-between; padding: 15px; background: #1e293b; border-bottom: 2px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 500px; margin: 20px auto; }
        .box { background: white; color: #1e293b; padding: 20px; border-radius: 12px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div id="login" class="page active">
        <div class="card">
            <h2>लॉगिन</h2>
            <input type="text" id="uid" class="input-box" placeholder="यूजर आईडी">
            <input type="password" id="pass" class="input-box" placeholder="पासवर्ड">
            <button class="btn" style="background:#2563eb" onclick="login()">लॉगिन करें</button>
            <span class="link" onclick="nav('signup')">नया अकाउंट (साइन अप)</span>
            <span class="link" onclick="nav('forgot')">पासवर्ड भूल गए?</span>
        </div>
    </div>

    <div id="signup" class="page">
        <div class="card">
            <h2>रजिस्टर करें</h2>
            <input type="text" class="input-box" placeholder="यूजर आईडी">
            <input type="email" class="input-box" placeholder="ईमेल">
            <input type="password" class="input-box" placeholder="पासवर्ड">
            <button class="btn" style="background:#10b981" onclick="alert('ईमेल नोटिफिकेशन भेजा गया!')">अकाउंट बनाएं</button>
            <span class="link" onclick="nav('login')">वापस लॉगिन</span>
        </div>
    </div>

    <div id="forgot" class="page">
        <div class="card">
            <h2>पासवर्ड रीसेट</h2>
            <input type="email" class="input-box" placeholder="ईमेल">
            <button class="btn" style="background:#f59e0b" onclick="alert('लिंक भेज दिया गया!')">लिंक भेजें</button>
            <span class="link" onclick="nav('login')">वापस लॉगिन</span>
        </div>
    </div>

    <div id="dashboard" class="page">
        <div class="top-bar">
            <strong>Omni Data Pro</strong>
            <span id="display-uid"></span>
        </div>
        <div class="grid">
            <div class="box">बेसिक डेटा</div><div class="box">ऑनलाइन डेटा</div>
            <div class="box">ई-कॉमर्स</div><div class="box">ट्रांसक्रिप्शन</div>
            <div class="box">इमेज-टू-टेक्स्ट</div><div class="box">वेब रिसर्च</div>
            <div class="box">डेटा क्लीनिंग</div><div class="box">सर्वे फिलिंग</div>
            <div class="box">मेडिकल डेटा</div><div class="box">लीगल डेटा</div>
        </div>
        <div style="text-align:center;">
            <button class="btn" style="width:200px; background:#ef4444;" onclick="location.reload()">लॉग आउट</button>
        </div>
    </div>

    <script>
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function login() {
            const uid = document.getElementById('uid').value;
            const pass = document.getElementById('pass').value;
            if(uid && pass) {
                document.getElementById('display-uid').innerText = "ID: " + uid;
                nav('dashboard');
            } else {
                alert("कृपया यूजर आईडी और पासवर्ड दोनों भरें!");
            }
        }
    </script>
</body>
</html>
