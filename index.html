<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; }
        .page { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .active { display: flex; }
        .box { background: #161e2e; padding: 30px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #2563eb; color: white; }
        .link-btn { background: none; color: #94a3b8; text-decoration: underline; font-size: 14px; margin-top: 10px; }
        #dash-pg.active { flex-direction: row; justify-content: flex-start; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन स्क्रीन -->
    <div id="login-pg" class="page active">
        <div class="box">
            <h1>Omni Data Pro</h1>
            <p>Welcome! Login to continue.</p>
            <input type="email" id="l-email" placeholder="Email">
            <input type="password" id="l-pass" placeholder="Password">
            <button onclick="login()">Login</button>
            <button class="link-btn" onclick="show('signup-pg')">नया अकाउंट बनाएँ (Sign Up)</button>
        </div>
    </div>

    <!-- 2. साइन-अप स्क्रीन -->
    <div id="signup-pg" class="page">
        <div class="box">
            <h1>Sign Up</h1>
            <input type="email" id="s-email" placeholder="Email">
            <input type="password" id="s-pass" placeholder="Password">
            <button style="background: #059669;" onclick="signup()">Register</button>
            <button class="link-btn" onclick="show('login-pg')">Back to Login</button>
        </div>
    </div>

    <!-- 3. डैशबोर्ड -->
    <div id="dash-pg" class="page">
        <div style="padding: 20px;">
            <h1>Dashboard</h1>
            <p>Welcome, User! You are verified.</p>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');

        function show(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // सही तरीके से साइन अप और ईमेल वेरिफिकेशन
        async function signup() {
            const { error } = await sb.auth.signUp({ 
                email: document.getElementById('s-email').value, 
                password: document.getElementById('s-pass').value,
                options: { emailRedirectTo: 'https://omnidatapro.vercel.app' }
            });
            if (error) alert("Error: " + error.message);
            else alert("सफल! अपने ईमेल का इनबॉक्स या स्पैम फोल्डर चेक करें और लिंक पर क्लिक करें।");
        }

        // लॉगिन और वेरिफिकेशन चेक
        async function login() {
            const { data, error } = await sb.auth.signInWithPassword({ 
                email: document.getElementById('l-email').value, 
                password: document.getElementById('l-pass').value 
            });
            if (error) alert(error.message);
            else if (data.user.email_confirmed_at) show('dash-pg');
            else alert("ईमेल वेरीफाई नहीं हुआ है! कृपया अपना इनबॉक्स चेक करें।");
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
