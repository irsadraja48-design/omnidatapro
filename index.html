<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0b0f19; color: #fff; }
        .page { display: none; height: 100vh; }
        .active { display: flex; }
        
        /* लॉगिन पेज */
        #login-pg { justify-content: center; align-items: center; }
        .box { background: #161e2e; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* डैशबोर्ड */
        #dash-pg { flex-direction: row; }
        .sidebar { width: 260px; background: #161e2e; height: 100vh; display: none; padding: 20px; flex-shrink: 0; }
        .sidebar.open { display: block; }
        .main-area { flex: 1; padding: 30px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन पेज (वेबसाइट नाम और वेलकम मैसेज के साथ) -->
    <div id="login-pg" class="page active">
        <div class="box">
            <h1 style="color: #38bdf8;">Omni Data Pro</h1>
            <p>Welcome to the pro website</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button style="background:#2563eb;" onclick="auth('login')">Login</button>
            <button style="background:#059669;" onclick="auth('signup')">Sign Up</button>
            <button style="background:none; text-decoration:underline; color:#94a3b8;" onclick="auth('forgot')">Forgot Password?</button>
        </div>
    </div>

    <!-- 2. डैशबोर्ड (कंप्लीट लेआउट) -->
    <div id="dash-pg" class="page">
        <div id="sidebar" class="sidebar">
            <h2 style="color:#38bdf8;">Omni Data Pro</h2>
            <div style="padding:15px; cursor:pointer;">👤 मेरी प्रोफाइल</div>
            <div style="padding:15px; cursor:pointer;">⚙️ सेटिंग्स</div>
            <div style="padding:15px; cursor:pointer;" onclick="location.reload()">⎋ लॉग आउट</div>
        </div>
        <div class="main-area">
            <button onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
            <div class="grid">
                <div class="card">बेसिक डेटा एंट्री</div>
                <div class="card">ऑनलाइन डेटा एंट्री</div>
                <div class="card">ई-कॉमर्स डेटा एंट्री</div>
                <div class="card">डेटा ट्रांसक्रिप्शन</div>
                <div class="card">इमेज टू टेक्स्ट</div>
                <div class="card">वेब रिसर्च और डेटा माइनिंग</div>
                <div class="card">डेटा क्लीनिंग</div>
                <div class="card">सर्वे फॉर्म फिलिंग</div>
                <div class="card">मेडिकल डेटा एंट्री</div>
                <div class="card">लीगल डेटा एंट्री</div>
            </div>
        </div>
    </div>

<script>
    const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');
    
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function auth(type) {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        
        if (type === 'login') {
            const { error } = await sb.auth.signInWithPassword({email:e, password:p});
            if (!error) showPage('dash-pg'); else alert("Login Failed!");
        } else if (type === 'signup') {
            const { error } = await sb.auth.signUp({email:e, password:p});
            if (!error) showPage('dash-pg'); else alert("Signup Failed!");
        } else if (type === 'forgot') {
            await sb.auth.resetPasswordForEmail(e);
            showPage('login-pg');
        }
    }
</script>
</body>
</html>
