<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; }
        .page { display: none; height: 100vh; }
        .active { display: flex; }
        #login-pg { justify-content: center; align-items: center; }
        .box { background: #161e2e; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; background: #0f172a; color: white; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        #dash-pg { flex-direction: row; }
        .sidebar { width: 260px; background: #161e2e; height: 100vh; display: none; padding: 20px; }
        .sidebar.open { display: block; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="login-pg" class="page active">
        <div class="box">
            <h1>Omni Data Pro</h1>
            <p>Welcome to the pro website</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button style="background:#2563eb;" onclick="runAuth('login')">Login</button>
            <button style="background:#059669;" onclick="runAuth('signup')">Sign Up</button>
            <button style="background:none; color:#94a3b8; text-decoration:underline;" onclick="runAuth('forgot')">Forgot Password?</button>
        </div>
    </div>

    <div id="dash-pg" class="page">
        <div id="sidebar" class="sidebar">
            <h2>Omni Data Pro</h2>
            <div onclick="location.reload()">⎋ लॉग आउट</div>
        </div>
        <div style="flex:1; padding:20px;">
            <button onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
            <div class="grid">
                <div class="card">डेटा एंट्री</div>
                <div class="card">ट्रांसक्रिप्शन</div>
                <div class="card">वेब रिसर्च</div>
            </div>
        </div>
    </div>

<script>
    const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');
    
    async function runAuth(type) {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        
        if (type === 'login') {
            const { error } = await sb.auth.signInWithPassword({email:e, password:p});
            if (!error) { document.getElementById('login-pg').classList.remove('active'); document.getElementById('dash-pg').classList.add('active'); }
            else alert("Login Failed: " + error.message);
        } else if (type === 'signup') {
            const { error } = await sb.auth.signUp({email:e, password:p});
            if (!error) alert("Sign up successful! Please check email.");
            else alert("Signup Failed: " + error.message);
        } else if (type === 'forgot') {
            await sb.auth.resetPasswordForEmail(e);
            alert("Reset link sent!");
        }
    }
</script>
</body>
</html>
