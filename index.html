<div id="login-view" class="view active">
    <div class="auth-box">
        <h3 style="color:#2563eb; margin-bottom:5px;">Omni Data Pro</h3>
        <p style="color:#64748b; font-size:13px; margin-bottom:20px;">वेबसाइट में आपका स्वागत है!</p>
        
        <h2>लॉगिन</h2>
        <input type="text" id="uid" class="input-box" placeholder="यूजर आईडी">
        <input type="password" id="pass" class="input-box" placeholder="पासवर्ड">
        
        <p style="text-align:right; font-size:12px; cursor:pointer; color:#ef4444; margin:5px 0;" onclick="alert('पासवर्ड रीसेट लिंक भेजा गया!')">पासवर्ड भूल गए?</p>
        
        <button class="btn" onclick="auth.login()">प्रवेश करें</button>
        <p onclick="ui.show('signup-view')" class="link">नया अकाउंट (साइन अप)</p>
    </div>
</div>
