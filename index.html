<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <style>
        body { background: #0f172a; margin: 0; font-family: sans-serif; color: white; }
        .page { display: none; padding: 20px; }
        .active { display: block; }
        .card { background: white; padding: 30px; border-radius: 20px; width: 300px; color: #1e293b; margin: 100px auto; text-align: center; }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .link { color: #2563eb; cursor: pointer; text-decoration: underline; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login" class="page active">
        <div class="card">
            <h2>लॉगिन</h2>
            <input type="text" id="uid" class="input-box" placeholder="यूजर आईडी">
            <input type="password" class="input-box" placeholder="पासवर्ड">
            <button class="btn" style="background:#2563eb" onclick="login()">लॉगिन</button>
            <span class="link" onclick="nav('signup')">साइन अप</span>
            <span class="link" onclick="nav('forgot')">फॉरगेट पासवर्ड</span>
        </div>
    </div>

    <div id="signup" class="page">
        <div class="card">
            <h2>रजिस्टर</h2>
            <input type="text" class="input-box" placeholder="यूजर आईडी">
            <input type="email" class="input-box" placeholder="ईमेल">
            <button class="btn" style="background:#10b981" onclick="alert('ईमेल भेज दिया गया!')">अकाउंट बनाएं</button>
            <span class="link" onclick="nav('login')">वापस लॉगिन</span>
        </div>
    </div>

    <div id="forgot" class="page">
        <div class="card">
            <h2>रीसेट</h2>
            <input type="email" class="input-box" placeholder="ईमेल">
            <button class="btn" style="background:#f59e0b" onclick="alert('लिंक भेजा गया!')">भेजें</button>
            <span class="link" onclick="nav('login')">वापस लॉगिन</span>
        </div>
    </div>

    <div id="dashboard" class="page">
        <h1>डैशबोर्ड</h1>
        <button class="btn" style="width:200px; background:#ef4444;" onclick="location.reload()">लॉग आउट</button>
    </div>

    <script>
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function login() {
            const id = document.getElementById('uid').value;
            if(id) { nav('dashboard'); }
            else { alert("यूजर आईडी डालें"); }
        }
    </script>
</body>
</html>
