<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; }
        .page { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .active { display: flex; }
        .box { background: #161e2e; padding: 30px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .link-btn { background: none; color: #94a3b8; text-decoration: underline; margin-top: 10px; border: none; cursor: pointer; }
        .status { margin-top: 15px; font-size: 13px; color: #60a5fa; min-height: 20px; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन स्क्रीन -->
    <div id="login-pg" class="page active">
        <div class="box">
            <h1>Omni Data Pro</h1>
            <p>Welcome back!</p>
            <input type="email" id="l-email" placeholder="Email">
            <input type="password" id="l-pass" placeholder="Password">
            <button style="background:#2563eb;" onclick="login()">Login</button>
            <button class="link-btn" onclick="show('signup-pg')">Sign Up</button>
            <button class="link-btn" onclick="show('forgot-pg')">Forgot Password?</button>
            <div id="l-status" class="status"></div>
        </div>
    </div>

    <!-- 2. साइन-अप स्क्रीन -->
    <div id="signup-pg" class="page">
        <div class="box">
            <h1>Omni Data Pro</h1>
            <p>Create account</p>
            <input type="email" id="s-email" placeholder="Email">
            <input type="password" id="s-pass" placeholder="Password">
            <button style="background:#059669;" onclick="signup()">Register</button>
            <button class="link-btn" onclick="show('login-pg')">Back</button>
            <div id="s-status" class="status"></div>
        </div>
    </div>

    <!-- 3. फॉरगेट पासवर्ड स्क्रीन -->
    <div id="forgot-pg" class="page">
        <div class="box">
            <h1>Omni Data Pro</h1>
            <p>Reset password</p>
            <input type="email" id="f-email" placeholder="Enter your email">
            <button style="background:#db2777;" onclick="resetPass()">Send Reset</button>
            <button class="link-btn" onclick="show('login-pg')">Back</button>
            <div id="f-status" class="status"></div>
        </div>
    </div>

    <!-- 4. डैशबोर्ड -->
    <div id="dash-pg" class="page">
        <div class="box">
            <h1>Welcome, User!</h1>
            <p>You are logged in.</p>
            <button style="background:#dc2626;" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');

        function show(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function setStatus(id, msg) { document.getElementById(id).innerText = msg; }

        async function signup() {
            const { error } = await sb.auth.signUp({ 
                email: document.getElementById('s-email').value, 
                password: document.getElementById('s-pass').value 
            });
            if (error) setStatus('s-status', error.message);
            else setStatus('s-status', "ईमेल चेक करें, लिंक भेज दिया गया है।");
        }

        async function login() {
            const { data, error } = await sb.auth.signInWithPassword({ 
                email: document.getElementById('l-email').value, 
                password: document.getElementById('l-pass').value 
            });
            if (error) setStatus('l-status', error.message);
            else if (data.user.email_confirmed_at) show('dash-pg');
            else setStatus('l-status', "कृपया पहले अपना ईमेल वेरीफाई करें!");
        }

        async function resetPass() {
            const { error } = await sb.auth.resetPasswordForEmail(document.getElementById('f-email').value);
            if (error) setStatus('f-status', error.message);
            else setStatus('f-status', "रीसेट लिंक भेज दिया गया है।");
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
