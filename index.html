<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <style>
        /* लेआउट और बेसिक डिजाइन */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f4f7f6; height: 100vh; }
        .view { display: none; height: 100vh; width: 100%; }
        .active { display: flex !important; }
        
        /* लॉगिन/साइन-अप स्क्रीन */
        .auth-bg { display: none; justify-content: center; align-items: center; background: #2c3e50; }
        .card { background: white; padding: 30px; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .link { margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; text-decoration: underline; }

        /* डैशबोर्ड स्क्रीन */
        #dashboard-view { display: none; flex-direction: row; }
        #sidebar { width: 250px; background: #1a252f; color: white; padding: 20px; }
        .nav-item { padding: 15px 0; border-bottom: 1px solid #34495e; cursor: pointer; }
        #work-area { flex-grow: 1; padding: 20px; background: #ecf0f1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन -->
    <div id="login-view" class="view auth-bg active">
        <div class="card">
            <h2>Omni Data Pro</h2>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button onclick="show('dashboard-view')">Sign In</button>
            <div class="link" onclick="show('signup-view')">Sign Up</div>
            <div class="link" onclick="show('forgot-view')">Forgot Password?</div>
        </div>
    </div>

    <!-- 2. साइन-अप -->
    <div id="signup-view" class="view auth-bg">
        <div class="card">
            <h2>Create Account</h2>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Create Password">
            <button onclick="show('login-view')">Register</button>
            <div class="link" onclick="show('login-view')">Back to Login</div>
        </div>
    </div>

    <!-- 3. फॉरगेट पासवर्ड -->
    <div id="forgot-view" class="view auth-bg">
        <div class="card">
            <h2>Reset Password</h2>
            <input type="email" placeholder="Enter Registered Email">
            <button onclick="show('login-view')">Send Reset Link</button>
            <div class="link" onclick="show('login-view')">Back to Login</div>
        </div>
    </div>

    <!-- 4. डैशबोर्ड -->
    <div id="dashboard-view" class="view">
        <div id="sidebar">
            <h3>OMNI DATA PRO</h3>
            <div class="nav-item">Dashboard</div>
            <div class="nav-item" onclick="show('login-view')">Logout</div>
        </div>
        <div id="work-area">
            <h3>Work Area</h3>
            <button onclick="addRow()">Add New Entry</button>
            <table id="data-table">
                <thead><tr><th>Client</th><th>Project</th><th>Code</th><th>Status</th></tr></thead>
                <tbody><tr><td>-</td><td>-</td><td>-</td><td>-</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        function show(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }
        function addRow() {
            let tbody = document.getElementById('data-table').getElementsByTagName('tbody')[0];
            let row = tbody.insertRow();
            for(let i=0; i<4; i++) row.insertCell(i).innerHTML = "-";
        }
    </script>
</body>
</html>
