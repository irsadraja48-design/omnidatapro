<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <style>
        body { margin: 0; background: #0f172a; font-family: sans-serif; min-height: 100vh; color: white; }
        .hologram-text { color: #60a5fa; text-shadow: 0 0 10px #2563eb, 0 0 20px #2563eb; font-weight: bold; }
        .auth-box { width: 350px; background: #1e293b; padding: 30px; border-radius: 20px; margin: 50px auto; text-align: center; border: 1px solid #334155; }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .link { color: #60a5fa; cursor: pointer; font-size: 14px; margin-top: 15px; text-decoration: underline; }
        .hidden { display: none; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 600px; margin: auto; }
        .card { padding: 15px; background: #1e293b; border-radius: 10px; text-align: center; border: 1px solid #334155; cursor: pointer; }
        .top-nav { background: #0f172a; padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="login-view" class="auth-box">
        <h3 class="hologram-text">✨ Omni Data Pro</h3>
        <p style="font-size:12px; color:#94a3b8;">वेबसाइट में आपका स्वागत है!</p>
        <input type="text" id="uid-login" class="input-box" placeholder="यूजर आईडी">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        <p style="font-size:12px; color:#ef4444; cursor:pointer;" onclick="alert('लिंक भेजा गया!')">फॉरगेट पासवर्ड?</p>
        <button class="btn" onclick="enterDashboard()">प्रवेश करें</button>
        <p class="link" onclick="toggleAuth()">नया अकाउंट (साइन अप)</p>
    </div>

    <div id="signup-view" class="auth-box hidden">
        <h3 class="hologram-text">✨ Omni Data Pro</h3>
        <p style="font-size:12px; color:#94a3b8;">वेबसाइट में आपका स्वागत है!</p>
        <input type="text" id="uid-signup" class="input-box" placeholder="यूजर आईडी">
        <input type="email" class="input-box" placeholder="ईमेल">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        <button class="btn" onclick="enterDashboard()">रजिस्टर करें</button>
        <p class="link" onclick="toggleAuth()">वापस लॉगिन पर जाएं</p>
    </div>

    <div id="dashboard-view" class="hidden">
        <div class="top-nav">
            <span class="hologram-text">✨ Omni Data Pro</span>
            <span id="user-display">यूजर: </span>
        </div>
        <div class="grid">
            <div class="card">बेसिक डेटा</div><div class="card">ऑनलाइन डेटा</div>
            <div class="card">ई-कॉमर्स</div><div class="card">ट्रांसक्रिप्शन</div>
            <div class="card">इमेज-टू-टेक्स्ट</div><div class="card">वेब रिसर्च</div>
            <div class="card">डेटा क्लीनिंग</div><div class="card">सर्वे फिलिंग</div>
            <div class="card">मेडिकल डेटा</div><div class="card">लीगल डेटा</div>
        </div>
        <div style="text-align:center; padding:20px;">
            <button class="btn" style="width:100px; background:#ef4444;" onclick="location.reload()">लॉग आउट</button>
            <button class="btn" style="width:100px; background:#64748b; margin-left:10px;" onclick="location.reload()">बैक</button>
        </div>
    </div>

    <script>
        function toggleAuth() {
            document.getElementById('login-view').classList.toggle('hidden');
            document.getElementById('signup-view').classList.toggle('hidden');
        }
        function enterDashboard() {
            const uid = document.getElementById('uid-login').value || document.getElementById('uid-signup').value || "Guest";
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('signup-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-display').innerText = "यूजर: " + uid;
        }
    </script>
</body>
</html>
