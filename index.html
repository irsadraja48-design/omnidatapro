<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Data Pro v2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161e2e; padding: 2rem; border-radius: 15px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .page { display: none; }
        .page.active { display: block; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .main-btn { background: #2563eb; color: white; }
        .text-btn { background: none; color: #64748b; font-size: 0.85rem; text-decoration: underline; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <!-- लॉगिन पेज -->
    <div id="login-pg" class="page active">
        <h2>लॉगिन (Login)</h2>
        <input type="email" id="email-in" placeholder="ईमेल">
        <input type="password" id="pass-in" placeholder="पासवर्ड">
        <button class="btn main-btn" onclick="authAction('login')">लॉगिन करें</button>
        <button class="btn text-btn" onclick="switchPage('signup-pg')">नया अकाउंट बनाएं</button>
        <button class="btn text-btn" onclick="switchPage('forgot-pg')">पासवर्ड भूल गए?</button>
    </div>

    <!-- साइनअप पेज -->
    <div id="signup-pg" class="page">
        <h2>साइन अप (Sign Up)</h2>
        <input type="email" id="email-up" placeholder="ईमेल">
        <input type="password" id="pass-up" placeholder="पासवर्ड">
        <button class="btn main-btn" onclick="authAction('signup')">रजिस्टर करें</button>
        <button class="btn text-btn" onclick="switchPage('login-pg')">वापस लॉगिन पर जाएं</button>
    </div>

    <!-- फॉरगेट पेज -->
    <div id="forgot-pg" class="page">
        <h2>पासवर्ड रीसेट</h2>
        <input type="email" id="email-fg" placeholder="अपना ईमेल लिखें">
        <button class="btn main-btn" onclick="authAction('forgot')">रीसेट लिंक भेजें</button>
        <button class="btn text-btn" onclick="switchPage('login-pg')">वापस लॉगिन पर जाएं</button>
    </div>
</div>

<script>
    const supabase = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');

    function switchPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function authAction(type) {
        let email, pass, error;
        if(type === 'login') {
            email = document.getElementById('email-in').value;
            pass = document.getElementById('pass-in').value;
            ({error} = await supabase.auth.signInWithPassword({email, password: pass}));
        } else if(type === 'signup') {
            email = document.getElementById('email-up').value;
            pass = document.getElementById('pass-up').value;
            ({error} = await supabase.auth.signUp({email, password: pass}));
        } else if(type === 'forgot') {
            email = document.getElementById('email-fg').value;
            ({error} = await supabase.auth.resetPasswordForEmail(email));
        }
        
        if (error) alert("Error: " + error.message); 
        else alert("सफलतापूर्वक पूर्ण हुआ!");
    }
</script>
</body>
</html>
