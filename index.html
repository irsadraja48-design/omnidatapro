<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; }
        .page { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .active { display: flex; }
        .box { background: #161e2e; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        #dash-pg { align-items: flex-start; flex-direction: row; }
        .sidebar { width: 260px; background: #161e2e; height: 100vh; display: none; padding: 20px; }
        .sidebar.open { display: block; }
    </style>
</head>
<body>

    <!-- लॉगिन पेज -->
    <div id="login-pg" class="page active">
        <div class="box">
            <h1>Omni Data Pro</h1>
            <p>Welcome to the pro website</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button style="background:#2563eb;" onclick="authAction('login')">Login</button>
            <button style="background:#059669;" onclick="authAction('signup')">Sign Up</button>
            <button style="background:none; color:#94a3b8; text-decoration:underline;" onclick="authAction('forgot')">Forgot Password?</button>
        </div>
    </div>

    <!-- डैशबोर्ड -->
    <div id="dash-pg" class="page">
        <div id="sidebar" class="sidebar">
            <h2>Omni Data Pro</h2>
            <div onclick="location.reload()" style="cursor:pointer;">⎋ लॉग आउट</div>
        </div>
        <div style="padding:20px;">
            <button onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
        </div>
    </div>

<script>
    const sb = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');
    
    async function authAction(type) {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        
        if (!e) { alert("कृपया ईमेल डालें!"); return; }

        if (type === 'login') {
            const { error } = await sb.auth.signInWithPassword({email:e, password:p});
            if (!error) { document.getElementById('login-pg').classList.remove('active'); document.getElementById('dash-pg').classList.add('active'); }
            else alert("लॉगिन असफल: " + error.message);
        } else if (type === 'signup') {
            if (!p || p.length < 6) { alert("पासवर्ड कम से कम 6 अक्षरों का हो!"); return; }
            const { error } = await sb.auth.signUp({email:e, password:p});
            if (!error) alert("साइन अप सफल! कृपया अपना ईमेल वेरीफाई करें।");
            else alert("साइन अप असफल: " + error.message);
        } else if (type === 'forgot') {
            await sb.auth.resetPasswordForEmail(e);
            alert("रीसेट लिंक आपके ईमेल पर भेज दिया गया है!");
        }
    }
</script>
</body>
</html>
