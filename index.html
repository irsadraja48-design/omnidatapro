<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <style>
        body { margin: 0; background: #0f172a; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: #1e293b; }
        .auth-box { width: 350px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: center; }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        /* बटन का मूवमेंट (Animation) */
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s, background 0.3s; }
        .btn:active { transform: scale(0.95); }
        .btn:hover { background: #1d4ed8; }

        .link { color: #2563eb; cursor: pointer; font-size: 14px; margin-top: 15px; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- लॉगिन स्क्रीन -->
    <div id="login-view" class="auth-box">
        <h3 style="margin:0;">Omni Data Pro</h3>
        <p style="font-size:13px; color:#64748b;">वेबसाइट में आपका स्वागत है!</p>
        <h2>लॉगिन</h2>
        <input type="text" class="input-box" placeholder="यूजर आईडी">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        <p style="text-align:right; font-size:12px; color:#ef4444; cursor:pointer;" onclick="alert('पासवर्ड रीसेट लिंक भेजा गया!')">पासवर्ड भूल गए?</p>
        <button class="btn" onclick="alert('प्रवेश सफल!')">प्रवेश करें</button>
        <p class="link" onclick="toggleView()">नया अकाउंट (साइन अप)</p>
    </div>

    <!-- साइन अप स्क्रीन -->
    <div id="signup-view" class="auth-box hidden">
        <h2>नया अकाउंट</h2>
        <input type="text" class="input-box" placeholder="नाम">
        <input type="email" class="input-box" placeholder="ईमेल">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        <button class="btn" onclick="alert('अकाउंट बन गया!')">रजिस्टर करें</button>
        <p class="link" onclick="toggleView()">वापस लॉगिन पर जाएं</p>
    </div>

    <script>
        function toggleView() {
            document.getElementById('login-view').classList.toggle('hidden');
            document.getElementById('signup-view').classList.toggle('hidden');
        }
    </script>
</body>
</html>
