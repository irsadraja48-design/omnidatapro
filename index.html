<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <style>
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 320px; text-align: center; }
        .input-box { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .login-btn { background: #2563eb; color: white; }
        .signup-btn { background: #e2e8f0; color: #1e293b; }
        .forgot-link { display: block; margin-top: 20px; color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="margin: 0;">Omni Data Pro</h1>
        <p style="color: #666; margin-bottom: 20px;">Welcome to the pro website</p>

        <input type="text" class="input-box" placeholder="ईमेल आईडी">
        <input type="password" class="input-box" placeholder="पासवर्ड">
        
        <button class="btn-main login-btn">लॉगिन</button>
        <button class="btn-main signup-btn">साइन अप</button>
        
        <a href="#" class="forgot-link">Forgot Password?</a>
    </div>

</body>
</html>
