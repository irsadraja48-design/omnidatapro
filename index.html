<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro - Full Commercial System</title>
    <style>
        /* लेआउट सेटिंग्स */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; height: 100vh; display: flex; flex-direction: column; }
        .view { display: none; height: 100vh; }
        .active { display: flex; }
        
        /* 1. ऑपरेशनल इंफ्रास्ट्रक्चर (Auth/Login View) */
        #auth-view { justify-content: center; align-items: center; background: #2c3e50; }
        .card { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; cursor: pointer; }
        .links { margin-top: 15px; cursor: pointer; color: #3498db; }

        /* 2. कमर्शियल वर्कस्पेस (Dashboard View) */
        #dashboard-view { display: none; flex-direction: row; }
        #sidebar { width: 260px; background: #1a252f; color: #ecf0f1; padding: 20px; display: flex; flex-direction: column; }
        .nav-item { padding: 15px 0; border-bottom: 1px solid #34495e; cursor: pointer; }
        
        #workspace { flex-grow: 1; padding: 20px; overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        
        /* डेटा ग्रिड और वैलिडेशन पैनल */
        .grid { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        #val-panel { width: 300px; padding: 20px; border-left: 1px solid #ddd; background: white; }
        .status-box { background: #f4f7f6; padding: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Auth Module -->
    <div id="auth-view" class="view active">
        <div class="card">
            <h2>Omni Data Pro</h2>
            <input type="text" class="input-field" placeholder="Username">
            <input type="password" class="input-field" placeholder="Password">
            <button class="btn" onclick="showView('dashboard-view')">Sign In</button>
            <div class="links" onclick="alert('Signup/Forgot Password')">Sign Up | Forgot Password</div>
        </div>
    </div>

    <!-- Main Commercial Dashboard -->
    <div id="dashboard-view" class="view">
        <div id="sidebar">
            <h2>OMNI DATA PRO</h2>
            <div class="nav-item">Dashboard</div>
            <div class="nav-item">Projects Management</div>
            <div class="nav-item">Work Queue</div>
            <div class="nav-item">Analytics Reports</div>
            <div class="nav-item">Dataset Library</div>
            <div class="nav-item">OCR Unit</div>
            <div class="nav-item">Data Cleaning</div>
            <div class="nav-item" style="margin-top: auto;" onclick="showView('auth-view')">Logout</div>
        </div>
        
        <div id="workspace">
            <div class="header-bar">
                <input type="text" placeholder="Search..." style="padding: 10px; width: 300px;">
                <button onclick="addRow()">Add Row</button>
            </div>
            <table class="grid" id="data-table">
                <thead><tr><th>Client Name</th><th>Project Category</th><th>Item Code</th><th>Description</th></tr></thead>
                <tbody><tr><td>-</td><td>-</td><td>-</td><td>-</td></tr></tbody>
            </table>
        </div>

        <!-- Live Validation Panel -->
        <div id="val-panel">
            <h3>System Status</h3>
            <div class="status-box">
                <p>Typing Speed: 0 WPM</p>
                <p>Data Confidence: 0%</p>
                <p>Status: Ready</p>
            </div>
        </div>
    </div>

    <script>
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }
        function addRow() {
            let tbody = document.getElementById('data-table').getElementsByTagName('tbody')[0];
            let row = tbody.insertRow();
            for(let i=0; i<4; i++) row.insertCell(i).innerHTML = "-";
        }
    </script>
</body>
</html>
