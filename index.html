<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro - Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-800">

    <div id="auth-interface" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-bold mb-6">Omni Data Pro</h1>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="ईमेल आईडी" class="w-full p-3 border rounded-xl" required>
                <input type="password" id="password" placeholder="पासवर्ड" class="w-full p-3 border rounded-xl" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">लॉगिन</button>
            </form>
        </div>
    </div>

    <div id="main-dashboard" class="hidden p-6 md:p-10">
        <h1 class="text-3xl font-bold text-white mb-8">आपका डैशबोर्ड</h1>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">बेसिक एंट्री</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">ऑनलाइन डेटा</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">ई-कॉमर्स</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">ट्रांसक्रिप्शन</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">इमेज-टू-टेक्स्ट</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">वेब रिसर्च</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">डेटा क्लीनिंग</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">सर्वे फिलिंग</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">मेडिकल डेटा</div>
            <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition">लीगल एंट्री</div>
        </div>
    </div>

    <script>
        // यहाँ अपनी असली Supabase की Key डालें
        const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            // सुपाबेस ऑथेंटिकेशन लॉजिक
            document.getElementById('auth-interface').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
        });
    </script>
</body>
</html>
