<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro | Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="glass p-10 rounded-2xl w-full max-w-md shadow-2xl">
        <!-- वेबसाइट का नाम -->
        <h1 class="text-3xl font-bold text-center mb-2 text-blue-400">Omni Data Pro</h1>
        <p class="text-center mb-8 text-gray-400">Welcome to the Pro Website</p>

        <!-- लॉगिन फॉर्म -->
        <div class="space-y-4">
            <input type="email" placeholder="ईमेल" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-blue-500 outline-none">
            <input type="password" placeholder="पासवर्ड" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-blue-500 outline-none">
            
            <button class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg font-bold transition">लॉगिन</button>
            
            <div class="flex justify-between text-sm text-gray-400">
                <button class="hover:text-white">साइन अप</button>
                <button class="hover:text-white">Forgot Password?</button>
            </div>
        </div>
    </div>

</body>
</html>
