<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>OmniData Pro | App</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        .screen { display: none; }
        .active { display: block; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .link { color: #007bff; cursor: pointer; text-decoration: underline; margin-top: 10px; display: block; }

        /* Dashboard Styles */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; position: fixed; top: 0; left: -250px; transition: 0.3s; padding: 20px; z-index: 1000; }
        .sidebar.open { left: 0; }
        .menu-item { padding: 15px 0; border-bottom: 1px solid #3e4f5f; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #ddd; cursor: pointer; font-weight: bold; }
        
        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:3000; }
        iframe { width: 100%; height: 90vh; border: none; }
    </style>
</head>
<body>

<!-- 1. AUTH SCREENS -->
<div id="auth-wrapper" class="active">
    <div id="login-box" class="screen active container">
        <h1>OmniData Pro</h1>
        <input type="text" id="login-uid" placeholder="User ID">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
        <span class="link" onclick="showScreen('signup-box')">Sign Up</span>
        <span class="link" onclick="showScreen('forget-box')">Forgot Password?</span>
    </div>
    <div id="signup-box" class="screen container">
        <h1>Sign Up</h1>
        <input type="text" id="new-uid" placeholder="New User ID">
        <input type="password" id="new-pass" placeholder="New Password">
        <button onclick="handleSignup()">Create Account</button>
        <span class="link" onclick="showScreen('login-box')">Back to Login</span>
    </div>
    <div id="forget-box" class="screen container">
        <h1>Reset Password</h1>
        <input type="text" id="reset-uid" placeholder="Enter User ID">
        <button onclick="alert('Reset link sent!')">Send Link</button>
        <span class="link" onclick="showScreen('login-box')">Back to Login</span>
    </div>
</div>

<!-- 2. DASHBOARD -->
<div id="dashboard-wrapper" style="display:none;">
    <div class="sidebar" id="sidebar">
        <h2>Menu</h2>
        <div class="menu-item" onclick="toggleSidebar()">⬅️ बैक</div>
        <div class="menu-item" onclick="location.reload()">🚪 लॉग आउट</div>
    </div>
    <div class="header">
        <span onclick="toggleSidebar()" style="cursor:pointer; font-weight:bold;">☰ Menu</span>
        <button onclick="location.reload()" style="background:#e74c3c; width:auto;">⬅️ बैक</button>
        <strong>OmniData Pro</strong>
        <span id="display-uid">User ID: ---</span>
    </div>
    <div class="grid" id="task-grid"></div>
</div>

<!-- 3. WORK SPACE MODAL -->
<div id="work-modal" class="modal">
    <div style="padding:15px; background:#f4f4f4; display:flex; justify-content:space-between; align-items:center;">
        <h2 id="modal-title" style="margin:0;">Work Space</h2>
        <button onclick="document.getElementById('work-modal').style.display='none'">⬅️ बैक (डैशबोर्ड)</button>
    </div>
    <iframe src="https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUqptlbsY4OgvB2_5XM8/edit"></iframe>
</div>

<script>
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    
    // Auth Functions
    function handleSignup() {
        localStorage.setItem(document.getElementById('new-uid').value, document.getElementById('new-pass').value);
        alert("अकाउंट बन गया! अब लॉगिन करें।");
        showScreen('login-box');
    }

    function handleLogin() {
        const uid = document.getElementById('login-uid').value;
        const pass = document.getElementById('login-pass').value;
        if (localStorage.getItem(uid) === pass) {
            document.getElementById('display-uid').innerText = "User ID: " + uid;
            document.getElementById('auth-wrapper').style.display = 'none';
            document.getElementById('dashboard-wrapper').style.display = 'block';
        } else { alert("गलत ID या पासवर्ड!"); }
    }

    // Dashboard Functions
    const tasks = ["1. बेसिक डेटा", "2. ऑनलाइन डेटा", "3. ईकॉमर्स", "4. ट्रांसक्रिप्शन", "5. इमेज टू टेक्स्ट", "6. वेब रिसर्च", "7. डेटा क्लीनिंग", "8. सर्वे फॉर्म", "9. मेडिकल एंट्री", "10. लीगल एंट्री", "11. माइनिंग", "12. अदर टास्क"];
    const grid = document.getElementById('task-grid');
    tasks.forEach(task => { grid.innerHTML += `<div class="card" onclick="openWork('${task}')">${task}</div>`; });
    function openWork(name) { document.getElementById('modal-title').innerText = name; document.getElementById('work-modal').style.display = 'block'; }
</script>
</body>
</html>
