<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Data Pro | Official</title>
    <style>
        :root { --primary: #007bff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        
        /* Sidebar Styling */
        .sidebar { width: 260px; background: var(--card); padding: 20px; border-right: 1px solid #334155; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 40px; }
        .menu-item { padding: 12px; margin-bottom: 8px; cursor: pointer; border-radius: 6px; transition: 0.3s; }
        .menu-item:hover { background: var(--primary); }
        
        /* Content Area */
        .main { flex: 1; padding: 40px; }
        .tool-box { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid #334155; max-width: 600px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; margin: 15px 0; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        
        .ai-badge { display: inline-block; padding: 5px 15px; background: #312e81; color: #818cf8; border-radius: 20px; font-size: 0.8rem; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">OMNI DATA PRO</div>
    <div class="menu-item">👤 मेरी प्रोफाइल</div>
    <div class="menu-item">⚙️ सेटिंग्स</div>
    <div class="menu-item">📂 मेरे प्रोजेक्ट्स</div>
    <div class="menu-item">❓ यूजर गाइड</div>
    <div class="menu-item" style="margin-top: 50px;">🚪 लॉग आउट</div>
</div>

<div class="main">
    <div class="ai-badge">✨ AI Feature Active</div>
    <h1>डेटा एंट्री वर्कस्पेस</h1>
    <div class="tool-box">
        <input type="text" placeholder="डेटा यहाँ दर्ज करें...">
        <button>प्रक्रिया शुरू करें (Process Data)</button>
    </div>
</div>

</body>
</html>
