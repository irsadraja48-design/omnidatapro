<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; padding-top: 50px; font-family: Arial; }
        .box { background: #1e293b; padding: 25px; border-radius: 10px; width: 300px; text-align: center; }
        .screen { display: none; }
        .active { display: block; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; background: #3b82f6; color: white; }
        .link { background: none; color: #94a3b8; text-decoration: underline; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <!-- लॉगिन स्क्रीन -->
    <div id="login-screen" class="screen active">
        <h2>लॉगिन</h2>
        <input type="email" id="l-email" placeholder="ईमेल">
        <input type="password" id="l-password" placeholder="पासवर्ड">
        <button onclick="login()">लॉगिन करें</button>
        <button class="link" onclick="showScreen('signup-screen')">नया अकाउंट (साइन अप)</button>
        <button class="link" onclick="showScreen('forgot-screen')">पासवर्ड भूल गए?</button>
    </div>

    <!-- साइन अप स्क्रीन -->
    <div id="signup-screen" class="screen">
        <h2>साइन अप</h2>
        <input type="email" id="s-email" placeholder="ईमेल">
        <input type="password" id="s-password" placeholder="पासवर्ड">
        <button onclick="signup()" style="background: #10b981;">अकाउंट बनाएं</button>
        <button class="link" onclick="showScreen('login-screen')">वापस लॉगिन पर जाएं</button>
    </div>

    <!-- फॉरगेट पासवर्ड स्क्रीन -->
    <div id="forgot-screen" class="screen">
        <h2>पासवर्ड रीसेट</h2>
        <input type="email" id="f-email" placeholder="अपना ईमेल लिखें">
        <button onclick="resetPassword()" style="background: #ef4444;">लिंक भेजें</button>
        <button class="link" onclick="showScreen('login-screen')">वापस लॉगिन पर जाएं</button>
    </div>
</div>

<script>
    const supabase = supabase.createClient('https://uenidxhrocphbtxpuyxr.supabase.co', 'sb_publishable_5RtT4h_eU42vaLH5RhMC2g_PScPgKc1');

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function login() {
        const { error } = await supabase.auth.signInWithPassword({ email: document.getElementById('l-email').value, password: document.getElementById('l-password').value });
        if (error) alert(error.message); else alert("लॉगिन सफल!");
    }

    async function signup() {
        const { error } = await supabase.auth.signUp({ email: document.getElementById('s-email').value, password: document.getElementById('s-password').value });
        if (error) alert(error.message); else alert("सफल! ईमेल चेक करें।");
    }

    async function resetPassword() {
        const { error } = await supabase.auth.resetPasswordForEmail(document.getElementById('f-email').value);
        if (error) alert(error.message); else alert("रीसेट लिंक भेज दिया गया है।");
    }
</script>

</body>
</html>
