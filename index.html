<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Omni Data Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; margin: 0; }
        .sidebar { width: 260px; background: #1e293b; height: 100vh; padding: 20px; box-sizing: border-box; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; margin-bottom: 30px; }
        .menu-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #334155; }
        .main { flex: 1; padding: 30px; }
        .search-bar { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: none; background: #334155; color: white; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #334155; cursor: pointer; }
        .footer-tools { margin-top: 50px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">Omni Data Pro</div>
    <div class="menu-item">👤 मेरी प्रोफाइल</div>
    <div class="menu-item">⚙️ सेटिंग्स</div>
    <div class="menu-item">📁 मेरे प्रोजेक्ट्स</div>
    <div class="menu-item">❓ यूजर गाइड</div>
    <div class="menu-item" onclick="location.reload()">⎋ लॉग आउट</div>
</div>

<div class="main">
    <input type="text" class="search-bar" placeholder="सर्च करें...">
    <div class="grid">
        <div class="card">बेसिक डेटा एंट्री</div>
        <div class="card">ऑनलाइन डेटा एंट्री</div>
        <div class="card">ई-कॉमर्स डेटा एंट्री</div>
        <div class="card">डेटा ट्रांसक्रिप्शन</div>
        <div class="card">इमेज टू टेक्स्ट</div>
        <div class="card">वेब रिसर्च और डेटा माइनिंग</div>
        <div class="card">डेटा क्लीनिंग</div>
        <div class="card">सर्वे और फॉर्म फिलिंग</div>
        <div class="card">मेडिकल डेटा एंट्री</div>
        <div class="card">लीगल डेटा एंट्री</div>
    </div>
    
    <div class="footer-tools">
        <button onclick="history.back()">⬅️ बैक बटन</button>
        <div style="text-align: center;">
            <p>AI Picture</p>
        </div>
    </div>
</div>

</body>
</html>
