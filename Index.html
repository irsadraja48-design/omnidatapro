
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Data Pro - Commercial System</title>
    <style>
        /* पूरी तरह से रिस्पॉन्सिव और प्रोफेशनल लेआउट */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; height: 100vh; display: flex; flex-direction: column; }
        
        /* व्यू मैनेजर (साइन अप और डैशबोर्ड को हैंडल करने के लिए) */
        .app-view { display: none; height: 100%; width: 100%; }
        .app-view.active { display: flex; }

        /* साइन अप / लॉगिन पेज */
        #login-view { background: #2c3e50; justify-content: center; align-items: center; }
        .login-card { background: #fff; padding: 40px; border-radius: 8px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-card h2 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-primary { width: 100%; padding: 12px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }

        /* डैशबोर्ड लेआउट */
        #dashboard-view { display: none; flex-direction: row; }
        #sidebar { width: 260px; background: #1a252f; color: #bdc3c7; display: flex; flex-direction: column; }
        .nav-item { padding: 15px 20px; cursor: pointer; transition: 0.3s; border-bottom: 1px solid #23313e; }
        .nav-item:hover { background: #2c3e50; color: #fff; }
        
        #workspace { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* डेटा ग्रिड */
        .grid-wrapper { background: #fff; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #ddd; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        
        /* लाइव वैलिडेशन साइडबार */
        #val-sidebar { width: 300px; background: #fff; border-left: 1px solid #ddd; padding: 20px; }
        .status-box { background: #f4f7f6; padding: 15px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- भाग 1: लॉगिन / साइन-अप व्यू -->
    <div id="login-view" class="app-view active">
        <div class="login-card">
            <h2>Omni Data Pro</h2>
            <div class="form-group"><input type="text" placeholder="Username"></div>
            <div class="form-group"><input type="password" placeholder="Password"></div>
            <button class="btn-primary" onclick="navigateTo('dashboard')">Sign In</button>
        </div>
    </div>

    <!-- भाग 2: मेन डैशबोर्ड व्यू -->
    <div id="dashboard-view" class="app-view">
        <div id="sidebar">
            <div style="padding: 20px; font-weight: bold; color: #fff;">OMNI DATA PRO</div>
            <div class="nav-item" onclick="alert('Dashboard Loaded')">Dashboard</div>
            <div class="nav-item" onclick="alert('Projects Folder')">My Projects</div>
            <div class="nav-item" onclick="alert('Work Queue')">Work Queue</div>
            <div class="nav-item" onclick="alert('Generating Reports')">Reports</div>
            <div class="nav-item" style="margin-top: auto;" onclick="navigateTo('login')">Logout</div>
        </div>
        
        <div id="workspace">
            <div class="header-bar">
                <input type="text" placeholder="Search entries..." style="padding: 10px; width: 300px;">
                <button style="padding: 10px 20px;" onclick="addRow()">Add Row</button>
            </div>
            <div class="grid-wrapper">
                <table id="data-table">
                    <thead>
                        <tr><th>Client Name</th><th>Project Type</th><th>Item Code</th><th>Description</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>-</td><td>-</td><td>-</td><td>-</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="val-sidebar">
            <h3>System Status</h3>
            <div class="status-box">
                <p>Typing Speed: 0 WPM</p>
                <p>Data Confidence: 0%</p>
                <p>Status: Ready</p>
            </div>
        </div>
    </div>

    <!-- जावास्क्रिप्ट (लॉजिक) -->
    <script>
        function navigateTo(viewId) {
            // सभी व्यू छुपाएं
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            // केवल सिलेक्टेड व्यू दिखाएं
            document.getElementById(viewId + '-view').classList.add('active');
        }

        function addRow() {
            // टेबल में नई खाली पंक्ति जोड़ना
            const table = document.getElementById('data-table').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            for(let i=0; i<4; i++) {
                const cell = newRow.insertCell(i);
                cell.innerHTML = "-";
            }
        }
    </script>
</body>
</html>
